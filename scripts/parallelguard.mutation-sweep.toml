[[mutation]]
id = "seam-swapped-through-pointer-helper"
path = "internal/storebinding/sqlite/sqlite_fence_release_linux_test.go"
find = '''func TestLinuxSQLiteWriterReservationReleaseRetriesInjectedCloseFailure(t *testing.T) {
	path := filepath.Join(t.TempDir(), graphFilename)
	if err := os.WriteFile(path, sqliteHeaderForTest(1, 1), 0o600); err != nil {
		t.Fatalf("writing SQLite source: %v", err)
	}
	file, err := os.Open(path)
	if err != nil {
		t.Fatalf("opening SQLite source: %v", err)
	}
	reservation := &linuxSQLiteWriterReservation{database: file}
	originalClose := closeSQLiteReservationFile
	calls := 0
	closeSQLiteReservationFile = func(candidate *os.File) error {
		calls++
		if calls == 1 {
			return errors.New("injected close failure")
		}
		return originalClose(candidate)
	}
	t.Cleanup(func() {
		closeSQLiteReservationFile = originalClose
		_ = reservation.Release()
	})'''
replace = '''func reviewSwapSeam[T any](t *testing.T, seam *T, replacement T) T {
	original := *seam
	*seam = replacement
	t.Cleanup(func() { *seam = original })
	return original
}

func TestLinuxSQLiteWriterReservationReleaseRetriesInjectedCloseFailure(t *testing.T) {
	t.Parallel()
	path := filepath.Join(t.TempDir(), graphFilename)
	if err := os.WriteFile(path, sqliteHeaderForTest(1, 1), 0o600); err != nil {
		t.Fatalf("writing SQLite source: %v", err)
	}
	file, err := os.Open(path)
	if err != nil {
		t.Fatalf("opening SQLite source: %v", err)
	}
	reservation := &linuxSQLiteWriterReservation{database: file}
	calls := 0
	var originalClose func(*os.File) error
	originalClose = reviewSwapSeam(t, &closeSQLiteReservationFile, func(candidate *os.File) error {
		calls++
		if calls == 1 {
			return errors.New("injected close failure")
		}
		return originalClose(candidate)
	})
	t.Cleanup(func() {
		_ = reservation.Release()
	})'''
expect_output = ["TestLinuxSQLiteWriterReservationReleaseRetriesInjectedCloseFailure", "but calls t.Parallel"]

