# Proves every refusal in scripts/canary-eval.py and canary-fetch.sh holds.
#
# The evaluator's value is mostly in what it refuses to answer. One that
# answered "keep" wherever it could not measure would pass every happy-path
# assertion and retire the epic's open question by silence, the outcome
# gs-jbyc forbids. So each row flips one refusal and requires the suite red.
#
# Not swept: whether the figures read are right. The join, de-duplication and
# window bounds belong to `gc usage` and `bd`, which have their own suites.

[sweep]
name = "canary-eval refuses to answer when it cannot separate the regimes"
repo = ".."

[sweep.gate]
argv = ["go", "test", "./scripts/", "-count=1", "-run", "TestCanary"]
timeout_s = 600

# The control exists so a fleet-wide move is not read as one agent's
# regression. Flipped, a control breach is simply ignored and the subject's
# crossing -- caused by the same fleet-wide move -- reverts a level on evidence
# that says nothing about it.
[[mutation]]
id = "control-breach-ignored"
path = "scripts/canary-eval.py"
find = '''        elif role == "control":'''
replace = '''        elif role == "control" and False:'''
expect_output = ["TestCanaryAMovedControlVoidsTheRunInsteadOfRevertingASubject"]

# A void must outrank a revert, because both are true at once exactly when the
# control says the revert is not attributable.
[[mutation]]
id = "revert-outranks-void"
path = "scripts/canary-eval.py"
find = '''    if voids:
        verdict, code = "no-verdict", EXIT_NO_VERDICT
    elif reverts:
        verdict, code = "revert", EXIT_REVERT'''
replace = '''    if reverts:
        verdict, code = "revert", EXIT_REVERT
    elif voids:
        verdict, code = "no-verdict", EXIT_NO_VERDICT'''
expect_output = ["TestCanaryAMovedControlVoidsTheRunInsteadOfRevertingASubject"]

# The sample floor on the window side. Flipped, a window holding three beads
# answers with the same confidence as one holding three hundred.
[[mutation]]
id = "window-sample-floor-removed"
path = "scripts/canary-eval.py"
find = '''    if win_value is None or have_win < floor:'''
replace = '''    if win_value is None:'''
expect_output = ["TestCanaryARowUnderItsBeadFloorIsNoVerdictNotAPass"]

# The day floor. Flipped, a single day's burst satisfies a rule whose margin
# was derived from day-to-day spread -- the one quantity a single day cannot
# be compared against.
[[mutation]]
id = "day-floor-removed"
path = "scripts/canary-eval.py"
find = '''    if len(window.days) < min_days:'''
replace = '''    if False:'''
expect_output = ["TestCanaryARowUnderItsDayFloorIsNoVerdictNotAPass"]

# The witness. Flipped, a row whose level never reached a running session is
# compared against the wrong regime and reported as a clean result.
[[mutation]]
id = "witness-never-checked"
path = "scripts/canary-eval.py"
find = '''    if witness == "output_per_invocation_not_up":
        base_opi = baseline_witness.output_per_invocation'''
replace = '''    if False:
        base_opi = baseline_witness.output_per_invocation'''
expect_output = ["TestCanaryAWitnessGoingTheWrongWayVoidsTheRow"]

# The witness's own margin. Flipped back to the metric margin, a rate row's
# 1.05 lets output per invocation double before the row voids.
[[mutation]]
id = "witness-reuses-the-metric-margin"
path = "scripts/canary-eval.py"
find = '''float(spec["witness_margin"])'''
replace = '''margin'''
expect_output = ["TestCanaryAnAuthoredRateRowStillGetsAWitness/a_doubled_output_voids_against_its_own_margin"]

# A witnessed row that states no witness_margin. Flipped, the refusal is gone
# and the row reaches the margin read without one.
[[mutation]]
id = "witness-without-its-own-margin-accepted"
path = "scripts/canary-eval.py"
find = '''    if witness == "output_per_invocation_not_up" and "witness_margin" not in spec:'''
replace = '''    if False:'''
expect_output = ["TestCanaryAnAuthoredRateRowStillGetsAWitness/a_witness_with_no_margin_of_its_own_is_refused"]

# The witness for a row judged on what it AUTHORED. Flipped back to the bead
# join, it is silently absent for exactly that row -- the agent that closes no
# beads of its own -- so a planner still running the old level reads clean.
[[mutation]]
id = "authored-row-witness-read-off-the-join"
path = "scripts/canary-eval.py"
find = '''        base_opi = baseline_witness.output_per_invocation
        win_opi = window_witness.output_per_invocation'''
replace = '''        base_opi = baseline.output_per_invocation
        win_opi = window.output_per_invocation'''
expect_output = ["TestCanaryAnAuthoredRateRowStillGetsAWitness"]

# Cost sharing across a session that closed several beads. Flipped, a session
# that finished three beads reads as three times more expensive than one that
# finished one, which inverts the metric.
[[mutation]]
id = "shared-session-charged-in-full"
path = "scripts/canary-eval.py"
find = '''        share = 1.0 / len(held)'''
replace = '''        share = 1.0'''
expect_output = ["TestCanaryASessionHoldingSeveralBeadsSplitsItsCost"]

# report-only rows are the thin agents, which cross any line on noise alone.
# Flipped, they vote, and the run answers at random rather than declining.
[[mutation]]
id = "report-only-rows-vote"
path = "scripts/canary-eval.py"
find = '''        if role == "subject":'''
replace = '''        if role in ("subject", "report-only"):'''
expect_output = ["TestCanaryReportOnlyRowsNeverChangeTheVerdict"]

# The line is recomputed from the baseline. Flipped to a literal, the tool
# still passes every happy-path assertion while comparing against a figure
# that no longer tracks the log it came from.
[[mutation]]
id = "line-pinned-instead-of-recomputed"
path = "scripts/canary-eval.py"
find = '''    line = base_value * (1.0 + margin)'''
replace = '''    line = 24.0'''
expect_output = ["TestCanaryTheLineIsRecomputedFromTheBaselineNotPinnedInTheCriteria"]

# An agent the window never observed. Flipped, it is silently inside its line,
# and the epic is declared safe for an agent no measurement covered.
[[mutation]]
id = "unmeasured-agent-reads-as-inside"
path = "scripts/canary-eval.py"
find = '''            elif state != "inside":
                voids.append(f"{agent_type}: {state} ({detail})")'''
replace = '''            elif state == "never-happens":
                voids.append(f"{agent_type}: {state} ({detail})")'''
expect_output = ["TestCanaryAnAgentWithNoWindowDataIsNoVerdictNotAPass"]

# The machinery filter. Flipped, this city's ~9,000 daily order-tracking
# records land in the per-bead denominator and every regression reads as a
# large improvement.
[[mutation]]
id = "machinery-beads-counted-as-work"
path = "scripts/canary-eval.py"
find = '''def is_work_bead(bead):
    """Whether a bead record is a unit of delivered work."""'''
replace = '''def is_work_bead(bead):
    """Whether a bead record is a unit of delivered work."""
    return True'''
expect_output = ["TestCanaryMachineryBeadsAreNotUnitsOfWork"]

# Local-day bucketing for the day floor. Flipped to UTC, the floor counts a
# calendar that does not match the window the baseline states.
[[mutation]]
id = "day-floor-counts-utc-days"
path = "scripts/canary-eval.py"
find = '''        .astimezone(zone)'''
replace = '''        .astimezone(ZoneInfo("UTC"))'''
expect_output = ["TestCanaryDayFloorCountsLocalDaysNotUTCDays/one_UTC_date"]

# An unrecorded verdict is not a pass. Flipped, the authored-fail rate falls
# whenever outcome recording slips, which reads as the planner improving.
[[mutation]]
id = "unrecorded-outcome-counts-as-a-verdict"
path = "scripts/canary-eval.py"
find = '''        if outcome is None:
            continue'''
replace = '''        if outcome is None:
            outcome = "pass"'''
expect_output = ["TestCanaryABeadWithNoRecordedVerdictIsNotAPass/no_outcome"]

# Only pass and fail are verdicts. Flipped, a canceled or skipped bead is a
# pass in the denominator and dilutes the rate the same way.
[[mutation]]
id = "non-verdict-outcome-counts-toward-the-rate"
path = "scripts/canary-eval.py"
find = '''        if outcome not in VERDICT_OUTCOMES:'''
replace = '''        if outcome not in VERDICT_OUTCOMES and False:'''
expect_output = ["TestCanaryABeadWithNoRecordedVerdictIsNotAPass/canceled"]

# Flipped, a day holding only canceled beads satisfies the day floor.
[[mutation]]
id = "non-verdict-outcome-covers-a-day"
path = "scripts/canary-eval.py"
find = '''            sample.other_outcomes[outcome] += 1'''
replace = '''            sample.other_outcomes[outcome] += 1
            sample.days.add(local_day(bead.get("closed_at")))'''
expect_output = ["TestCanaryABeadWithNoRecordedVerdictIsNotAPass/a_day_of_only_canceled_beads_covers_no_day"]

# Non-verdict outcomes are reported beside the rate. Flipped, they vanish
# from the report and a rate read off canceled work looks complete.
[[mutation]]
id = "non-verdict-outcomes-not-reported"
path = "scripts/canary-eval.py"
find = '''    return ", ".join(f"{name} {n}" for name, n in sorted(counts.items()))'''
replace = '''    return "-"'''
expect_output = ["TestCanaryABeadWithNoRecordedVerdictIsNotAPass/canceled"]

# A relative margin over a zero baseline puts the line at zero. Flipped, one
# failure in the window reverts a seat whose baseline was clean.
[[mutation]]
id = "zero-baseline-draws-a-line"
path = "scripts/canary-eval.py"
find = '''    if base_value == 0:'''
replace = '''    if False:'''
expect_output = ["TestCanaryAnAuthoredRateWithNoDrawableLineIsNoVerdict/baseline_with_no_failures"]

# Every crossed subject is named, not just the first. A revert decision is per
# agent, so a report that stopped at the first crossing would leave a level
# un-reverted with the run reading as handled.
[[mutation]]
id = "only-the-first-crossing-is-reported"
path = "scripts/canary-eval.py"
find = '''            if state == "crossed":
                reverts.append(agent_type)'''
replace = '''            if state == "crossed" and not reverts:
                reverts.append(agent_type)'''
expect_output = ["TestCanaryEveryCrossedSubjectIsNamedNotJustTheFirst"]

# --- the criteria file is refused when malformed, not read looser ---

# Flipped, a misspelled role is no role the vote reads, and a subject that
# crossed its line keeps its level.
[[mutation]]
id = "any-role-accepted"
path = "scripts/canary-eval.py"
find = '''(("role", ROLES),'''
replace = '''(("role", (spec.get("role"),)),'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/misspelled_role"]

[[mutation]]
id = "any-metric-accepted"
path = "scripts/canary-eval.py"
find = '''("metric", tuple(FLOOR_KEYS)),'''
replace = '''("metric", (spec.get("metric"),)),'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/misspelled_metric"]

# Flipped, a misspelled witness is never checked.
[[mutation]]
id = "any-witness-accepted"
path = "scripts/canary-eval.py"
find = '''("witness", WITNESSES)):'''
replace = '''("witness", (spec.get("witness"),))):'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/misspelled_witness"]

[[mutation]]
id = "missing-key-accepted"
path = "scripts/canary-eval.py"
find = '''    for key in sorted(required - set(spec)):'''
replace = '''    for key in ():'''
expect_output = [
  "TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/no_role",
  "TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/no_day_floor",
]

# Flipped, a misspelled key sits beside the one it meant, which falls back.
[[mutation]]
id = "unknown-key-accepted"
path = "scripts/canary-eval.py"
find = '''    for key in sorted(set(spec) - allowed):'''
replace = '''    for key in ():'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/a_floor_its_metric_never_reads"]

[[mutation]]
id = "every-floor-key-allowed-on-every-metric"
path = "scripts/canary-eval.py"
find = '''    allowed = required | {"min_baseline_" + FLOOR_KEYS[metric][4:]}'''
replace = '''    allowed = required | {"min_baseline_" + FLOOR_KEYS[metric][4:]} | set(FLOOR_KEYS.values())'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/a_floor_its_metric_never_reads"]

[[mutation]]
id = "author-allowed-on-every-metric"
path = "scripts/canary-eval.py"
find = '''    if metric == "author_fail_rate":
        allowed.add("author")'''
replace = '''    if True:
        allowed.add("author")'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/an_author_on_a_row_judged_on_session_cost"]

[[mutation]]
id = "witness-margin-allowed-on-every-row"
path = "scripts/canary-eval.py"
find = '''    if witness == "output_per_invocation_not_up":
        allowed.add("witness_margin")'''
replace = '''    if True:
        allowed.add("witness_margin")'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/a_witness_margin_on_an_unwitnessed_row"]

[[mutation]]
id = "schema-unchecked"
path = "scripts/canary-eval.py"
find = '''    if schema != CRITERIA_SCHEMA:'''
replace = '''    if False:'''
expect_output = [
  "TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/no_schema",
  "TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/an_unknown_schema",
]

[[mutation]]
id = "unknown-top-level-key-accepted"
path = "scripts/canary-eval.py"
find = '''    for key in sorted(set(criteria) - {"schema", "agent"}):'''
replace = '''    for key in ():'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/an_unknown_top-level_key"]

# A row with no type still needs a name the refusal can point at.
[[mutation]]
id = "untyped-row-named-none"
path = "scripts/canary-eval.py"
find = '''                else f"[[agent]] row {index}")'''
replace = '''                else f"row {agent_type!r}")'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/no_type"]

# Flipped, the first fault hides the rest and each fix costs another run.
[[mutation]]
id = "only-the-first-refusal-is-printed"
path = "scripts/canary-eval.py"
find = '''    for error in errors:'''
replace = '''    for error in errors[:1]:'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/misspelled_floor_key"]

# Flipped, the refusal is printed and the malformed rule is judged anyway.
[[mutation]]
id = "refused-criteria-still-judged"
path = "scripts/canary-eval.py"
find = '''    if errors:
        return EXIT_USAGE'''
replace = '''    if False:
        return EXIT_USAGE'''
expect_output = ["TestCanaryAMalformedCriteriaRowIsRefusedNotReadLooser/misspelled_role"]

# A fixed offset buckets the far side of a DST change an hour off.
[[mutation]]
id = "local-day-at-a-fixed-offset"
path = "scripts/canary-eval.py"
find = '''        .astimezone(zone)'''
replace = '''        .astimezone(datetime.fromisoformat("2026-01-01T00:00-05:00").tzinfo)'''
expect_output = ["TestCanaryDayFloorCountsLocalDaysNotUTCDays/across_the_DST_change"]

# Flipped, a reading with no zone named counts days in one nobody chose.
[[mutation]]
id = "unnamed-zone-defaulted"
path = "scripts/canary-eval.py"
find = '''        zone = ZoneInfo(args.zone or "")'''
replace = '''        zone = ZoneInfo(args.zone or "America/Chicago")'''
expect_output = ['--zone="": exit']

# Flipped, an unknown zone ends in a traceback rather than a refusal.
[[mutation]]
id = "unknown-zone-crashes"
path = "scripts/canary-eval.py"
find = '''    except (ZoneInfoNotFoundError, ValueError):'''
replace = '''    except ValueError:'''
expect_output = ['--zone="Mars/Olympus": exit']

# Flipped, a failed call leaves the files fetched before it.
[[mutation]]
id = "fetch-failure-keeps-staged-files"
path = "scripts/canary-fetch.sh"
find = '''trap 'rm -rf -- "$stage"' EXIT'''
replace = '''trap ':' EXIT'''
expect_output = ["FAIL call 2: leaves no output file"]

# Flipped, a stale dump in --out is read as part of the new window.
[[mutation]]
id = "fetch-reuses-a-non-empty-out"
path = "scripts/canary-fetch.sh"
find = '''if [ -n "$(ls -A -- "$out" 2>/dev/null)" ]; then'''
replace = '''if false; then'''
expect_output = ["FAIL names the cause"]
