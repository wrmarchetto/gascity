version: "2"

run:
  modules-download-mode: readonly

severity:
  default: error

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  # Keep govet explicit in configured lint. The changed-scope target bounds
  # both this copy and the Go tool's vet to the same affected graph, preserving
  # their distinct diagnostics without repeating either across the whole repo.
  # Other default linters (errcheck, ineffassign, staticcheck, unused) remain
  # enabled alongside these configured extras.
  enable:
    - govet
    - errorlint
    - misspell
    - gocritic
    - revive
    - unconvert
    - unparam

  settings:
    misspell:
      locale: US

  exclusions:
    # node_modules is gitignored, npm-installed, third-party content, and the
    # flatted package inside it ships a Go port. The go tool skips testdata and
    # dot/underscore directories but NOT node_modules, so `go list ./...`
    # includes that package and a full-repo `make lint` went red with 3 issues
    # in code this repo neither owns nor compiles. CI never saw it: its lint job
    # runs no `npm ci`, so the directory is absent there and only a machine that
    # has built the dashboard hits this.
    #
    # Anchored on any path segment rather than the one web workspace, so a
    # nested node_modules from a future npm workspace is covered without
    # another edit. No matching formatters.exclusions entry: `golangci-lint fmt
    # --diff ./...` and `go vet ./...` are both already clean on that file, so
    # only the linters walk it.
    paths:
      - (^|/)node_modules/
    rules:
      # runtime shadows stdlib but is isolated to internal/.
      - path: internal/runtime/
        linters:
          - revive
        text: "var-naming"
      # exec is an established package name — renaming would break imports.
      - path: internal/runtime/exec/
        linters:
          - revive
        text: "var-naming"
      - path: internal/beads/exec/
        linters:
          - revive
        text: "var-naming"
      # api is an established package name for the HTTP API server.
      - path: internal/api/
        linters:
          - revive
        text: "var-naming"
      # mail is an established package name — renaming would break imports.
      - path: internal/mail/
        linters:
          - revive
        text: "var-naming"
      # extmsg is an established package name for external messaging.
      - path: internal/extmsg/
        linters:
          - revive
        text: "var-naming"
      # These domain packages intentionally use package-qualified exported names
      # (for example sling.SlingResult) to keep adapter call sites explicit.
      - path: internal/convoy/
        linters:
          - revive
        text: "stutters"
      - path: internal/graphroute/
        linters:
          - revive
        text: "stutters"
      - path: internal/sling/
        linters:
          - revive
        text: "stutters"
