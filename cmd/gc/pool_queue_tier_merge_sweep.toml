# Proves the merged pool queue keeps one tier's rows when the other tier's
# bd call fails, as the routed-then-alias ladder did before ci-mozmau merged
# the tiers (gs-g0m7). The string goldens in internal/config catch any edit
# to the query text, and are regenerated by any deliberate one, so they are
# not the gate here. The ordering tests are.
#
# repo = "../.." resolves against this file's directory (cmd/gc/), so it is
# always the checkout the spec was read out of. See the mutation-sweep skill.

[sweep]
name = "pool queue tier merge survives one failing tier"
repo = "../.."

[sweep.gate]
argv = [
  "go", "test", "./cmd/gc/",
  "-count=1",
  "-run", "TestHookClaimOrdering",
]
timeout_s = 900

[[mutation]]
id = "routed-tier-failure-skips-the-alias-tier"
path = "internal/config/workquery.go"
find = '''routedReadyTierCommand(includeEphemeralReady) + `; ` +'''
replace = '''routedReadyTierCommand(includeEphemeralReady) + ` && ` +'''
expect_output = ["--- FAIL: TestHookClaimOrderingTakesPoolAliasWorkWhenTheRoutedTierYieldsNothing/failing"]
