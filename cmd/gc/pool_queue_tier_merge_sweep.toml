# Proves the merged pool queue keeps either tier's rows when the other tier's
# bd call fails, in both stdout shapes bd fails with: nothing, and the --json
# error object a RunE failure prints (gs-g0m7, gs-rvfb303a39b96f-f07), and
# that a same-second tie across the tiers goes to the lower id. The string
# goldens in internal/config catch any edit to the query text, and are
# regenerated by any deliberate one, so they are not the gate here. The
# ordering tests are.
#
# repo = "../.." resolves against this file's directory (cmd/gc/), so it is
# always the checkout the spec was read out of. See the mutation-sweep skill.

[sweep]
name = "pool queue tier merge survives one failing tier and breaks ties by id"
repo = "../.."

[sweep.gate]
argv = [
  "go", "test", "./cmd/gc/",
  "-count=1",
  "-run", "TestHookClaimOrdering",
]
timeout_s = 900

[[mutation]]
id = "routed-tier-failure-skips-the-alias-tier"
path = "internal/config/workquery.go"
find = '''routedReadyTierCommand(includeEphemeralReady) + `; ` +'''
replace = '''routedReadyTierCommand(includeEphemeralReady) + ` && ` +'''
expect_output = [
  "--- FAIL: TestHookClaimOrderingTakesOneTiersWorkWhenTheOtherTierYieldsNothing/routed_failing_silently",
  "--- FAIL: TestHookClaimOrderingTakesOneTiersWorkWhenTheOtherTierYieldsNothing/routed_failing_with_an_error_object",
]

# The same coupling written alias-first, so a failing alias tier skips the
# routed tier. The row above cannot see it.
[[mutation]]
id = "alias-tier-failure-skips-the-routed-tier"
path = "internal/config/workquery.go"
find = '''	return `{ ` + routedReadyTierCommand(includeEphemeralReady) + `; ` +
		poolAliasReadyTierCommand(includeEphemeralReady) + `; ` +'''
replace = '''	return `{ ` + poolAliasReadyTierCommand(includeEphemeralReady) + ` && ` +
		routedReadyTierCommand(includeEphemeralReady) + `; ` +'''
expect_output = [
  "--- FAIL: TestHookClaimOrderingTakesOneTiersWorkWhenTheOtherTierYieldsNothing/alias_failing_silently",
  "--- FAIL: TestHookClaimOrderingTakesOneTiersWorkWhenTheOtherTierYieldsNothing/alias_failing_with_an_error_object",
]

[[mutation]]
id = "merge-iterates-a-tier-error-object"
path = "internal/config/workquery.go"
find = '''`[.[] | arrays | .[]] | sort_by('''
replace = '''`[.[][]] | sort_by('''
expect_output = [
  "--- FAIL: TestHookClaimOrderingTakesOneTiersWorkWhenTheOtherTierYieldsNothing/alias_failing_with_an_error_object",
  "--- FAIL: TestHookClaimOrderingTakesOneTiersWorkWhenTheOtherTierYieldsNothing/routed_failing_with_an_error_object",
]

# jq's sort is stable, so without the id a tie keeps tier order and the routed
# row wins. The priority-first control also goes red here, on its exact-literal
# strip, so the signature names the tie row's claim rather than any red.
[[mutation]]
id = "merge-drops-the-id-tiebreak"
path = "internal/config/workquery.go"
find = '''sort_by(.created_at // "", .id // "")`'''
replace = '''sort_by(.created_at // "")`'''
expect_output = [
  "--- FAIL: TestHookClaimOrderingTakesTheOlderBeadAcrossBothPoolTiers/same-second_tie_goes_to_the_lower_id_over_the_earlier_tier",
  '''claimed "z-routed-tied-p0", want "a-pool-tied-p3"''',
]
