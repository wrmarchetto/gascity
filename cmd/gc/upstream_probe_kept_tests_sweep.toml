# Proves the upstream-probe close gate's "adds no test path" refusal counts
# kept tests alone, so a kept sweep spec cannot satisfy it, that a
# behavior-free branch keeping no test is told a remedy it can meet, and that
# `gc internal upstream-classify` prints the same tests list the gate reads.
#
# repo = "../.." resolves against THIS file's directory (cmd/gc/), so it always
# means the checkout the spec was read out of. See the mutation-sweep skill.

[sweep]
name = "a kept sweep spec is not the test a behavioral patch owes"
repo = "../.."

[sweep.gate]
argv = [
  "go", "test", "./cmd/gc/",
  "-count=1",
  "-run", "TestEvaluateUpstreamProbeCloseGateScopesProbeByBranchShape|TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly|TestUpstreamProbeClassifyPaths",
]
timeout_s = 900

# --- the close gate ---

[[mutation]]
id = "refusal-counts-every-kept-path"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''	if len(upstreamProbeKeptTests(kept)) == 0 {'''
replace = '''	if len(kept) == 0 {'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateScopesProbeByBranchShape/upstream-code-and-sweep-spec-only/probe"]

[[mutation]]
id = "every-kept-path-is-a-test"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''		if upstreamProbeTestPath(path) {'''
replace = '''		if true {'''
expect_output = ["--- FAIL: TestUpstreamProbeClassifyPaths/sweep-spec-with-sweep-and-gate-tables-is-kept-but-not-a-test"]

[[mutation]]
id = "no-kept-path-is-a-test"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''		if upstreamProbeTestPath(path) {'''
replace = '''		if false {'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateScopesProbeByBranchShape/upstream-code-and-test/vacuous-after-revert"]

# --- the behavior-free branch keeping no test ---

[[mutation]]
id = "untested-remedy-counts-every-kept-path"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''if tests := upstreamProbeKeptTests(kept); len(tests) == 0 {'''
replace = '''if tests := kept; len(tests) == 0 {'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-and-sweep-spec-without-test/no-probe"]

[[mutation]]
id = "untested-branch-told-to-run-its-tests"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''if tests := upstreamProbeKeptTests(kept); len(tests) == 0 {'''
replace = '''if false {'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-only-without-test/no-probe-names-the-touched-package-tests"]

[[mutation]]
id = "tested-branch-told-it-keeps-no-test"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''if tests := upstreamProbeKeptTests(kept); len(tests) == 0 {'''
replace = '''if true {'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-docs-and-test/no-probe"]

[[mutation]]
id = "package-hint-dropped"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''	case pkg != "":'''
replace = '''	case false:'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-only-without-test/no-probe-names-the-touched-package-tests"]

[[mutation]]
id = "package-hint-ignores-test-presence"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''strings.HasSuffix(p, "_test.go") && touched[dir]'''
replace = '''touched[dir]'''
expect_output = [
  "--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-only-without-test/no-probe-names-the-touched-package-tests",
  "--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-only-without-test/no-probe-names-no-untested-package",
]

[[mutation]]
id = "package-hint-ignores-touch"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''strings.HasSuffix(p, "_test.go") && touched[dir]'''
replace = '''strings.HasSuffix(p, "_test.go")'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-only-without-test/no-probe-names-no-untested-package"]

[[mutation]]
id = "root-package-hint-doubles-its-dot"
path = "cmd/gc/upstream_probe_close_gate.go"
find = '''"./" + strings.TrimPrefix(dir+"/", "./")'''
replace = '''"./" + dir + "/"'''
expect_output = ["--- FAIL: TestEvaluateUpstreamProbeCloseGateTreatsBehaviorFreeBranchAsTestOnly/comment-only-without-test/no-probe-names-the-root-package-tests"]

# --- the audit interface ---

[[mutation]]
id = "classify-prints-kept-as-tests"
path = "cmd/gc/cmd_internal_upstream_classify.go"
find = '''nonNilStrings(upstreamProbeKeptTests(kept))'''
replace = '''nonNilStrings(kept)'''
expect_output = ["--- FAIL: TestUpstreamProbeClassifyPaths/mutation-sweep-spec-is-kept-but-not-a-test"]

[[mutation]]
id = "classify-prints-no-tests"
path = "cmd/gc/cmd_internal_upstream_classify.go"
find = '''nonNilStrings(upstreamProbeKeptTests(kept))'''
replace = '''nonNilStrings(nil)'''
expect_output = ["--- FAIL: TestUpstreamProbeClassifyPaths/named-test-paths-are-kept"]

[[mutation]]
id = "classify-prints-null-tests"
path = "cmd/gc/cmd_internal_upstream_classify.go"
find = '''nonNilStrings(upstreamProbeKeptTests(kept))'''
replace = '''upstreamProbeKeptTests(nil)'''
expect_output = ["stdout lacks a kept, tests, reverted or behavioral list"]
