# Proves routed wisps join the pool queue at bd 1.0.4, where `bd ready`
# returns no wisps and the queue reads them through `bd query` as a third leg
# (gs-rvfb303a39b96f-f01). The string goldens in internal/config are
# regenerated by any deliberate edit, so they are not the gate here. The
# ordering tests are.
#
# repo = "../.." resolves against this file's directory (cmd/gc/), so it is
# always the checkout the spec was read out of. See the mutation-sweep skill.

[sweep]
name = "pool queue merges routed wisps oldest first at bd 1.0.4"
repo = "../.."

[sweep.gate]
argv = [
  "go", "test", "./cmd/gc/",
  "-count=1",
  "-run", "TestHookClaimOrdering",
]
timeout_s = 900

# The pre-fix shape: the wisp leg gone from the merge, so a routed wisp is
# served only by the late rung, after every newer routed or alias bead.
[[mutation]]
id = "queue-drops-the-routed-wisp-leg"
path = "internal/config/workquery.go"
find = '''		legacyEphemeralPoolDemandShell(ephemeralRoutedMatchJQ(), 0, includeEphemeralReady, true) + `; } | ` +'''
replace = '''		`} | ` +'''
expect_output = [
  "--- FAIL: TestHookClaimOrderingTakesTheOlderBeadAcrossBothPoolTiers/older_routed_wisp_beats_newer_routed_and_pool-alias_beads",
  '''claimed "routed-newer-p0", want "wisp-older-p3"''',
]

# The rows below are the jq filter's route and assignee checks. The claim
# repeats them in Go (hookCandidateClaimable), and the ordering gate passed
# with the first two flipped. The reconciler's count has no such check, so
# the count-form test is their gate.

[[mutation]]
id = "wisp-leg-matches-any-route"
path = "internal/config/workquery.go"
find = '''	return `(` + jqMeta(beadmeta.RoutedToMetadataKey) + ` == $target)`'''
replace = '''	return `(` + jqMeta(beadmeta.RoutedToMetadataKey) + ` != "")`'''
gate = { argv = ["go", "test", "./internal/config/", "-count=1", "-run", "TestEffectiveWorkQueryBD104SurfacesLegacyEphemeralRoutedWork"], timeout_s = 900 }
expect_output = [
  "--- FAIL: TestEffectiveWorkQueryBD104SurfacesLegacyEphemeralRoutedWork/routed",
  "served a decoy wisp alongside the routed one",
]

[[mutation]]
id = "wisp-leg-keeps-owned-wisps"
path = "internal/config/workquery.go"
find = '''		`select((.assignee // "") == "") | select(`+match+`)`,'''
replace = '''		`select(`+match+`)`,'''
gate = { argv = ["go", "test", "./internal/config/", "-count=1", "-run", "TestEffectiveWorkQueryBD104SurfacesLegacyEphemeralRoutedWork"], timeout_s = 900 }
expect_output = [
  "--- FAIL: TestEffectiveWorkQueryBD104SurfacesLegacyEphemeralRoutedWork/routed",
  "served a decoy wisp alongside the routed one",
]

# A migration-shape root rerouted to another pool belongs to that pool, so
# the count must not read it by its stale gc.run_target.
[[mutation]]
id = "migration-wisp-match-ignores-the-route"
path = "internal/config/workquery.go"
find = '''	return `((` + jqMeta(beadmeta.RoutedToMetadataKey) + ` == "") and (` + jqMeta(beadmeta.RunTargetMetadataKey) + ` == $target)'''
replace = '''	return `((true) and (` + jqMeta(beadmeta.RunTargetMetadataKey) + ` == $target)'''
gate = { argv = ["go", "test", "./internal/config/", "-count=1", "-run", "TestEffectiveWorkQueryBD104SurfacesLegacyEphemeralRoutedWork"], timeout_s = 900 }
expect_output = [
  "--- FAIL: TestEffectiveWorkQueryBD104SurfacesLegacyEphemeralRoutedWork/routed",
  '''EffectivePoolDemandQuery() = "2", want the one legacy ephemeral routed bead counted''',
]
